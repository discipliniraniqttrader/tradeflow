<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Flow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: тетрадка на трейдър, превърната в инструмент. Карирана хартия, синьо мастило, зелен и червен маркер. */
:root{
  --paper:#eef1f5; --grid:#dfe5ec; --sheet:#fbfcfd; --ink:#17233a; --muted:#5a6880; --rule:#d3dae4;
  --blue:#2450a6; --blue-soft:#e3eaf7; --win:#127a4e; --win-soft:#dff2e9; --loss:#c22f3a; --loss-soft:#fae5e6;
  --warn:#9a6300; --warn-soft:#fbf0d9; --cell:#e7ebf1;
  --hand:"Caveat","Segoe Print",cursive; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121926; --grid:#182132; --sheet:#1a2333; --ink:#e8edf5; --muted:#9aa8bd; --rule:#2c384c;
  --blue:#86aaf2; --blue-soft:#24324c; --win:#4cc48f; --win-soft:#17352b; --loss:#f0777f; --loss-soft:#3d2026;
  --warn:#e0b050; --warn-soft:#3a2f17; --cell:#243044; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121926; --grid:#182132; --sheet:#1a2333; --ink:#e8edf5; --muted:#9aa8bd; --rule:#2c384c;
  --blue:#86aaf2; --blue-soft:#24324c; --win:#4cc48f; --win-soft:#17352b; --loss:#f0777f; --loss-soft:#3d2026;
  --warn:#e0b050; --warn-soft:#3a2f17; --cell:#243044; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:400 14px/1.5 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-block:18px 8px}
header.top h1{font:700 38px/1 var(--hand);margin:0;color:var(--blue)}
header.top span{color:var(--muted);font-size:13px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{appearance:none;background:none;border:0;color:var(--muted);font:600 14px var(--body);padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--blue)}
main{padding-block:16px 30px;display:grid;gap:14px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;min-width:0}
.sheet h2{font-size:15px;font-weight:700;margin:0 0 2px}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:6px;padding:9px 12px}
.banner b{color:var(--warn)}
.status{display:flex;align-items:center;gap:10px;border-radius:6px;padding:11px 14px;font-weight:600;border:1px solid var(--rule);background:var(--sheet)}
.status .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sheet)}
.status.good .dot{background:var(--win)} .status.stop .dot{background:var(--loss)} .status.wait .dot{background:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.kpi{background:var(--sheet);padding:13px 15px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:25px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.kpi .h{color:var(--muted);font-size:12px}
.pos{color:var(--win)} .neg{color:var(--loss)}
.insight{font:600 25px/1.25 var(--hand);color:var(--ink);margin:0}
.insight mark{background:none;color:inherit;border-bottom:3px solid var(--blue)}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:12px var(--body);fill:var(--muted)}
.chart text.end{font-weight:600;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.dash{border-top-style:dashed}
.legend i.ring{width:9px;height:9px;border:2px solid var(--loss);border-radius:50%;background:var(--sheet)}
.bars{display:grid;gap:3px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 62px;align-items:center;gap:8px;padding:3px 0;font-size:13px;cursor:default}
.bar .n{min-width:0;overflow-wrap:anywhere}
.bar .n small{color:var(--muted);margin-left:3px}
.bar .t{position:relative;height:12px}
.bar .t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--rule)}
.bar .f{position:absolute;top:1px;height:10px;border-radius:0 4px 4px 0}
.bar .f.neg{right:50%;background:var(--loss);border-radius:4px 0 0 4px}
.bar .f.pos{left:50%;background:var(--win)}
.bar .x{text-align:right;font-weight:600}
.empty{color:var(--muted);padding:14px 0}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,18px);gap:3px;width:max-content}
.cal div{width:18px;height:18px;border-radius:3px;background:var(--cell)}
.cal div.head,.cal div.side{background:none;font-size:11px;color:var(--muted);white-space:nowrap;height:16px;line-height:16px;overflow:visible}
.cal div.side{height:18px;line-height:18px;width:20px}
.hist{display:flex;align-items:flex-end;gap:3px;height:124px;border-bottom:1px solid var(--rule)}
.hist>div{flex:1;min-width:0;border-radius:4px 4px 0 0;min-height:0;cursor:default}
.histx{display:flex;gap:3px;color:var(--muted);font-size:11px;margin-top:4px}
.histx span{flex:1;min-width:0;text-align:center;overflow:hidden}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:400 14px var(--body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:5px;padding:8px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.group{margin-top:15px}
.group>.t{font-size:13px;font-weight:700;margin-bottom:6px;display:block}
.ticks{display:flex;flex-wrap:wrap;gap:6px}
.tick{appearance:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:500 13px var(--body);padding:7px 10px;border-radius:5px;cursor:pointer;text-align:left}
.tick::before{content:"";flex:none;width:15px;height:15px;border:1.5px solid var(--muted);border-radius:3px;display:grid;place-items:center;font-size:12px;line-height:1}
.tick[aria-pressed="true"]{background:var(--win-soft);border-color:var(--win)}
.tick[aria-pressed="true"]::before{content:"✓";background:var(--win);border-color:var(--win);color:var(--sheet);font-weight:700}
.tick.bad[aria-pressed="true"]{background:var(--loss-soft);border-color:var(--loss)}
.tick.bad[aria-pressed="true"]::before{content:"✕";background:var(--loss);border-color:var(--loss)}
.btn{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:600 13px var(--body);padding:8px 12px;border-radius:5px;cursor:pointer}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.small{padding:4px 8px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:820px){.form-layout{grid-template-columns:minmax(0,1fr)}}
.preview{position:sticky;top:60px}
.bigR{font:700 54px/1 var(--hand)}
.check{display:flex;gap:8px;font-size:13px;padding:4px 0}
.check b{flex:none;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--sheet)}
.check.ok b{background:var(--win)} .check.no b{background:var(--loss)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--ink)}
td{padding:7px 8px;border-bottom:1px solid var(--rule)}
td.num,th.num{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--loss-soft);color:var(--loss);margin-right:3px}
.pill.ok{background:var(--win-soft);color:var(--win)}
.prog{height:14px;background:var(--cell);border-radius:4px;overflow:hidden;margin:6px 0 3px}
.prog i{display:block;height:100%}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--sheet);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:5px;max-width:250px;white-space:pre-line}
#toast{position:fixed;z-index:31;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-weight:600;padding:9px 14px;border-radius:6px;max-width:90vw}
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,28,.55);display:grid;place-items:center;padding:16px}
#modal .sheet{width:min(620px,100%)}
#modal textarea{height:210px;font-size:12px}
header.top .acct{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--cell);color:var(--muted)}
.badge.pro{background:var(--warn-soft);color:var(--warn)}
.lock{font-size:11px;margin-left:4px;opacity:.7}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.plan .price{font:700 44px/1 var(--hand);margin:8px 0}
.plan ul{padding-left:18px;margin:8px 0 14px}
.plan.best{border-color:var(--blue);border-width:2px}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.lesson .vid{position:relative;aspect-ratio:16/9;background:var(--cell);border-radius:5px;overflow:hidden;margin-bottom:10px;display:grid;place-items:center;color:var(--muted);font-weight:600}
.lesson .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chatlog{height:min(55vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:min(560px,92%);background:var(--cell);border-radius:8px;padding:7px 10px}
.msg.me{align-self:flex-end;background:var(--blue-soft)}
.msg b{font-size:12px}.msg time{color:var(--muted);font-size:11px;margin-left:6px}
.msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.coach p{margin:6px 0}
footer{color:var(--muted);font-size:12px;padding-block:0 26px}
footer a{color:var(--blue)}
@media (prefers-reduced-motion:no-preference){.prog i,.bar .f{transition:width .25s}}
</style>
</head>
<body>
<div class="wrap"><header class="top"><h1>Trading Flow</h1><span>Дневник на дисциплината</span><div class="acct" id="acct"></div></header></div>
<nav class="tabs"><div class="wrap" role="tablist" id="tabs"></div></nav>
<div class="wrap"><main id="view"></main>
<footer>Образователен инструмент, не е финансов съвет. Трейдингът носи висок риск. Без вход данните стоят само в този браузър; с вход се пазят в облака. Плащанията минават през Stripe. Създаден от <a href="https://www.youtube.com/channel/UCqOH81FaqP3ByyNECqoIJnQ" target="_blank" rel="noopener">Дисциплинираният Трейдър</a>.</footer></div>
<div id="tip" hidden></div><div id="toast" hidden></div><div id="modal" hidden></div>

<script>
'use strict';
const KEY='dt-dnevnik-v1';
const DAYS=['неделя','понеделник','вторник','сряда','четвъртък','петък','събота'];
const MISTAKES={almost:'„Почти“ сетъп',stop:'Местих стопа',tp:'Дръпнах TP',revenge:'Реванш след загуба',fomo:'Страх да не изпусна',size:'По-голям размер'};
const FLAGS={day:'Забранен ден',window:'Извън прозореца',over:'Над лимита сделки',afterstop:'След дневния стоп',plan:'Непълен чек-лист'};
const EMOTIONS=['Спокоен','Нетърпелив','Страх','Алчност','Разсеян'];
const POINT={NQ:20,MNQ:2,ES:50,MES:5,YM:5,MYM:.5,RTY:50,M2K:5,GC:100,MGC:10,CL:1000,MCL:100};
const DEFAULTS={start:'10:00',end:'12:30',maxTrades:1,dailyLoss:1,rValue:100,noDays:[1,5],
  setups:['LTF sweep в 1h FVG','Inverse FVG на LTF'],
  checklist:['Цената е в 1h FVG','Има sweep на LTF','Inverse FVG дава сигнал','Стопът е на място преди входа','Рискът е 1R'],
  acc:{name:'Funded акаунт',size:50000,target:3000,dd:2500,type:'trailing'}};
const TABS=[['dash','Табло'],['new','Нова сделка'],['list','Сделки'],['acc','Акаунт'],['rules','Правила'],['learn','Обучение'],['chat','Чат'],['plan','Абонамент']];

let ui={tab:'dash',period:90,setup:'',editId:null,form:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDay=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const bgDate=k=>{const[a,b,c]=k.split('-');return c+'.'+b+'.'+a};
const round=(x,n=2)=>{const p=10**n;return Math.round(x*p)/p};
const fmtR=r=>(r>0?'+':r<0?'−':'')+round(Math.abs(r)).toString()+'R';
const fmtM=m=>(m<0?'−':'')+'$'+Math.abs(Math.round(m)).toLocaleString('en-US');
const cls=r=>r>0?'pos':r<0?'neg':'';
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const toMin=t=>{if(!t)return null;const[a,b]=t.split(':').map(Number);return a*60+(b||0)};
let store=load();

function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(d&&Array.isArray(d.trades))return{demo:!!d.demo,trades:d.demo?demoTrades():d.trades,cfg:Object.assign(clone(DEFAULTS),d.cfg||{})};
  return{demo:true,trades:demoTrades(),cfg:clone(DEFAULTS)};
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store.demo?{demo:true,trades:[],cfg:store.cfg}:store))}catch(e){if(!cloud.user)toast('Браузърът не позволи запис. Направи резервно копие от „Правила“.')}cloudSave()}

/* Примерни данни: едни и същи при всяко отваряне и ясно маркирани */
function demoTrades(){
  let seed=20261104;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const out=[],now=new Date(),setups=DEFAULTS.setups,keys=Object.keys(MISTAKES);
  for(let i=95;i>=1;i--){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),w=d.getDay();
    if(w===0||w===6)continue;
    const sinful=(w===1||w===5);
    if(rnd()>(sinful?.14:.68))continue;
    const n=rnd()<.13?2:1;
    for(let j=0;j<n;j++){
      const m=[];if(rnd()<(j?.75:.2))m.push(keys[Math.floor(rnd()*keys.length)]);
      const clean=!m.length&&!sinful&&!j;
      const win=rnd()<(clean?.58:.3);
      const r=win?round(1.2+rnd()*(clean?1.6:.7)):round(clean?-1:-1-rnd()*.7);
      const late=!clean&&rnd()<.25;
      const h=late?13:10+Math.floor(rnd()*2),mi=Math.floor(rnd()*60);
      const cl=DEFAULTS.checklist.filter(()=>clean||rnd()<.8);
      out.push({id:'demo'+i+j,date:dayKey(d),time:pad(h)+':'+pad(mi),symbol:'NQ',dir:rnd()<.5?'long':'short',setup:setups[rnd()<.6?0:1],qty:1,entry:null,stop:null,exit:null,r,pnl:round(r*DEFAULTS.rValue,0),mistakes:m,checked:cl,total:DEFAULTS.checklist.length,emotion:clean?'Спокоен':EMOTIONS[1+Math.floor(rnd()*4)],note:'Примерна сделка',source:'demo'});
    }
  }
  return out;
}

/* Автоматична проверка на всяка сделка спрямо правилата */
function analyse(list){
  const cfg=store.cfg,sorted=list.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const count={},dayR={},s=toMin(cfg.start),e=toMin(cfg.end);
  return sorted.map(t=>{
    const flags=[],w=parseDay(t.date).getDay(),tm=toMin(t.time);
    if(cfg.noDays.includes(w))flags.push('day');
    if(tm!=null&&(tm<s||tm>e))flags.push('window');
    count[t.date]=(count[t.date]||0)+1;
    if(count[t.date]>cfg.maxTrades)flags.push('over');
    if((dayR[t.date]||0)<=-cfg.dailyLoss)flags.push('afterstop');
    if(t.total&&(t.checked||[]).length<t.total)flags.push('plan');
    dayR[t.date]=(dayR[t.date]||0)+(t.r||0);
    const pending=t.source==='import';
    return Object.assign({},t,{flags,pending,clean:!pending&&!flags.length&&!(t.mistakes||[]).length});
  });
}
function stats(a){
  const n=a.length,sum=a.reduce((x,t)=>x+t.r,0),w=a.filter(t=>t.r>0),l=a.filter(t=>t.r<0);
  const gw=w.reduce((x,t)=>x+t.r,0),gl=-l.reduce((x,t)=>x+t.r,0);
  let c=0,p=0,dd=0;a.forEach(t=>{c+=t.r;p=Math.max(p,c);dd=Math.max(dd,p-c)});
  const cl=a.filter(t=>t.clean);
  return{n,sum,win:n?w.length/n:0,exp:n?sum/n:0,pf:gl?gw/gl:(gw?Infinity:0),dd,clean:n?cl.length/n:0,cleanN:cl.length,cleanSum:cl.reduce((x,t)=>x+t.r,0),dirtySum:sum-cl.reduce((x,t)=>x+t.r,0),avgW:w.length?gw/w.length:0,avgL:l.length?gl/l.length:0};
}
function filtered(){
  let a=analyse(store.trades);
  if(ui.period){const lim=new Date();lim.setDate(lim.getDate()-ui.period);const k=dayKey(lim);a=a.filter(t=>t.date>=k)}
  if(ui.setup)a=a.filter(t=>t.setup===ui.setup);
  return a;
}

function renderTabs(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${ui.tab===k}">${l}${(k==='learn'||k==='chat')&&!isPro()?'<span class="lock">🔒</span>':''}</button>`).join('');
}
function render(){
  renderTabs();renderAcct();
  ({dash:viewDash,new:viewNew,list:viewList,acc:viewAcc,rules:viewRules,learn:viewLearn,chat:viewChat,plan:viewPlan,login:viewLogin})[ui.tab]();
}
function demoBanner(){

function todayStatus(){
  const c=store.cfg,now=new Date(),k=dayKey(now),m=now.getHours()*60+now.getMinutes();
  const tr=store.trades.filter(t=>t.date===k),r=tr.reduce((x,t)=>x+t.r,0);
  if(c.noDays.includes(now.getDay()))return['stop','✕',`Днес е ${DAYS[now.getDay()]}. По твоите правила не търгуваш.`];
  if(tr.length&&r<=-c.dailyLoss)return['stop','✕',`Дневният стоп е достигнат (${fmtR(r)}). Край за днес.`];
  if(tr.length>=c.maxTrades)return['stop','✕',`Използва ${tr.length} от ${c.maxTrades} сделки за днес. Край за днес.`];
  if(m<toMin(c.start))return['wait','…',`Прозорецът отваря в ${c.start}. Подготви чек-листа.`];
  if(m>toMin(c.end))return['wait','…',`Прозорецът затвори в ${c.end}. Запиши сесията, ако има какво.`];
  return['good','✓',`Прозорецът е отворен до ${c.end}. Остават ${c.maxTrades-tr.length} от ${c.maxTrades} сделки.`];
}

const kpi=(l,v,h)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="h">${h}</div></div>`;
const small=a=>a.length<20?'Под 20 сделки: гледай това като насока, не като извод.':'Сбор R и брой сделки.';
function costList(a){
  const out=[];
  Object.entries(MISTAKES).forEach(([k,l])=>{const x=a.filter(t=>(t.mistakes||[]).includes(k));if(x.length)out.push({label:l,n:x.length,sum:x.reduce((s,t)=>s+t.r,0)})});
  Object.entries(FLAGS).forEach(([k,l])=>{const x=a.filter(t=>t.flags.includes(k));if(x.length)out.push({label:l,n:x.length,sum:x.reduce((s,t)=>s+t.r,0)})});
  return out;
}
function group(a,fn){const m={};a.forEach(t=>{const k=fn(t);(m[k]=m[k]||{label:k,n:0,sum:0});m[k].n++;m[k].sum+=t.r});return Object.values(m).sort((x,y)=>y.sum-x.sum)}
function weekdays(a){return [1,2,3,4,5].map(d=>{const x=a.filter(t=>parseDay(t.date).getDay()===d);return{label:DAYS[d],n:x.length,sum:x.reduce((s,t)=>s+t.r,0)}}).filter(x=>x.n)}
function barList(items){
  if(!items.length)return '<div class="empty">Няма нарушения за този период.</div>';
  const max=Math.max(...items.map(i=>Math.abs(i.sum)),.01);
  return '<div class="bars">'+items.map(i=>{const w=Math.abs(i.sum)/max*50;const tip=`${i.label}\n${i.n} сделки, сбор ${fmtR(i.sum)}\nсредно ${fmtR(i.sum/i.n)}`;
    return `<div class="bar" data-tip="${esc(tip)}"><span class="n">${esc(i.label)}<small>${i.n}</small></span><span class="t"><span class="f ${i.sum<0?'neg':'pos'}" style="width:${w}%"></span></span><span class="x ${cls(i.sum)}">${fmtR(i.sum)}</span></div>`}).join('')+'</div>';
}
function calendar(){
  const by={};analyse(store.trades).forEach(t=>{const d=by[t.date]=by[t.date]||{r:0,n:0,bad:0};d.r+=t.r;d.n++;if(!t.clean)d.bad++});
  const now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7)-17*7);
  const max=Math.max(...Object.values(by).map(d=>Math.abs(d.r)),1);
  let h='<div class="side"></div>'+['П','','С','','П','','Н'].map(x=>`<div class="side">${x}</div>`).join('');
  let last=-1;
  for(let w=0;w<18;w++){
    const first=new Date(start);first.setDate(start.getDate()+w*7);
    const label=first.getMonth()!==last?first.toLocaleDateString('bg-BG',{month:'short'}).replace('.',''):'';last=first.getMonth();
    h+=`<div class="head">${esc(label)}</div>`;
    for(let i=0;i<7;i++){
      const d=new Date(first);d.setDate(first.getDate()+i);const k=dayKey(d),v=by[k];
      if(d>now){h+='<div style="background:none"></div>';continue}
      if(!v){h+=`<div data-tip="${bgDate(k)}\nБез сделки"></div>`;continue}
      const pct=Math.round(30+Math.abs(v.r)/max*70),c=v.r>=0?'var(--win)':'var(--loss)';
      h+=`<div style="background:color-mix(in srgb,${c} ${pct}%,var(--cell))" data-tip="${bgDate(k)} (${DAYS[d.getDay()]})\n${v.n} сделки, ${fmtR(v.r)}${v.bad?'\nС нарушения: '+v.bad:''}"></div>`;
    }
  }
  return `<div class="cal">${h}</div>`;
}
function histogram(a){
  const edges=[-3,-2,-1.5,-1,-.5,0,.5,1,1.5,2,3,99],bins=edges.slice(0,-1).map((e,i)=>({lo:e,hi:edges[i+1],n:0}));
  a.forEach(t=>{const b=bins.find(x=>t.r>=x.lo&&t.r<x.hi)||(t.r<-3?bins[0]:null);if(b)b.n++});
  const max=Math.max(...bins.map(b=>b.n),1);
  const lab=b=>b.hi===99?'3+':(b.lo>0?'+':b.lo<0?'−':'')+Math.abs(b.lo);
  return `<div class="hist">${bins.map(b=>`<div style="height:${b.n/max*100}%;background:${b.lo<0?'var(--loss)':'var(--win)'}" data-tip="От ${b.lo}R${b.hi===99?' нагоре':' до '+b.hi+'R'}\n${b.n} сделки"></div>`).join('')}</div><div class="histx">${bins.map(b=>`<span>${lab(b)}</span>`).join('')}</div>`;
}
function ticksFor(lo,hi){
  const span=(hi-lo)||1,raw=span/4,mag=10**Math.floor(Math.log10(raw)),f=raw/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;
  const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(round(v,4));return out;
}
function equity(a){
  const box=$('eq');if(!box)return;
  const W=Math.max(box.clientWidth,300),H=W<520?230:270,L=38,R=W<520?14:112,T=10,B=26;
  let c=0,g=0;const pts=[{i:0,c:0,g:0,t:null}];
  a.forEach((t,i)=>{c+=t.r;if(t.clean)g+=t.r;pts.push({i:i+1,c,g,t})});
  const vals=pts.flatMap(p=>[p.c,p.g]),lo=Math.min(...vals,0),hi=Math.max(...vals,0),pad_=(hi-lo)*.08||1;
  const y0=lo-pad_,y1=hi+pad_,X=i=>L+(W-L-R)*i/Math.max(pts.length-1,1),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const line=k=>pts.map((p,i)=>(i?'L':'M')+X(p.i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join('');
  const ticks=ticksFor(y0,y1);
  let ly1=Y(c),ly2=Y(g);if(Math.abs(ly1-ly2)<16){if(ly1<ly2)ly2=ly1+16;else ly1=ly2+16}
  const xStep=Math.max(1,Math.ceil(pts.length/(W<520?4:7)));
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Крива на резултата: реално ${fmtR(c)}, само чисти сделки ${fmtR(g)}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" ${v===0?'stroke-width="1.5"':'stroke-dasharray="2 4"'}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    ${pts.filter(p=>p.t&&p.i%xStep===0).map(p=>`<text x="${X(p.i)}" y="${H-7}" text-anchor="middle">${bgDate(p.t.date).slice(0,5)}</text>`).join('')}
    <path d="${line('g')}" fill="none" stroke="var(--win)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${line('c')}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.filter(p=>p.t&&!p.t.clean).map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.c)}" r="3.5" fill="var(--sheet)" stroke="var(--loss)" stroke-width="2"/>`).join('')}
    ${W>=520?`<text class="end" x="${W-R+8}" y="${ly1+4}">Реално ${fmtR(c)}</text><text class="end" x="${W-R+8}" y="${ly2+4}">Чисти ${fmtR(g)}</text>`:''}
    <line id="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" visibility="hidden"/>
    <rect id="eqHit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>
  </svg>`;
  const hit=$('eqHit'),cross=$('cross'),svg=box.querySelector('svg');
  const move=e=>{
    const rc=svg.getBoundingClientRect(),x=(e.clientX-rc.left)*W/rc.width;
    const i=Math.min(pts.length-1,Math.max(1,Math.round((x-L)/(W-L-R)*(pts.length-1)))),p=pts[i];if(!p||!p.t)return;
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('visibility','visible');
    const bad=[...(p.t.mistakes||[]).map(k=>MISTAKES[k]),...p.t.flags.map(k=>FLAGS[k])];
    showTip(`${bgDate(p.t.date)} ${p.t.time||''}\n${p.t.setup||''}\nСделка ${fmtR(p.t.r)}, общо ${fmtR(p.c)}${bad.length?'\nНарушения: '+bad.join(', '):p.t.pending?'\nЗа преглед':'\nЧиста сделка'}`,e.clientX,e.clientY);
  };
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{cross.setAttribute('visibility','hidden');hideTip()});
}

function calcTrade(f){

  return{r,pnl};
}

  ${a.map(t=>{const bad=[...(t.mistakes||[]).map(k=>MISTAKES[k]),...t.flags.map(k=>FLAGS[k])];return `<tr><td>${bgDate(t.date)}</td><td>${esc(t.time||'')}</td><td>${esc(t.symbol||'')}</td><td>${t.dir==='short'?'Short':'Long'}</td><td>${esc(t.setup||'')}</td><td class="num ${cls(t.r)}"><b>${fmtR(t.r)}</b></td><td class="num">${t.pnl==null?'':fmtM(t.pnl)}</td><td>${t.pending?'<span class="pill" style="background:var(--warn-soft);color:var(--warn)">За преглед</span>':''}${bad.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}${t.clean?'<span class="pill ok">Чиста</span>':''}</td><td><button class="btn small" data-coach="${esc(t.id)}">Разбор${isPro()?'':' 🔒'}</button> <button class="btn small" data-edit="${esc(t.id)}">Редакция</button> <button class="btn small danger" data-del="${esc(t.id)}">Изтрий</button></td></tr>`}).join('')}
  </tbody></table></div>`:'<div class="empty">Още няма сделки.</div>'}</div>`;
}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const head=text.split(/\r?\n/)[0]||'';const delim=[';','\t',','].sort((a,b)=>head.split(b).length-head.split(a).length)[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}
    else if(ch==='"')q=true;else if(ch===delim){row.push(cell);cell=''}
    else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function parseStamp(s){
  if(!s)return null;s=s.trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/)))return{date:`${m[1]}-${pad(m[2])}-${pad(m[3])}`,time:m[4]?pad(m[4])+':'+m[5]:'',ms:+new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+((s.match(/:(\d{2}):(\d{2})/)||[])[2]||0))};
  if((m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:[ ,]+(\d{1,2}):(\d{2}))?/)))return{date:`${m[3]}-${pad(m[2])}-${pad(m[1])}`,time:m[4]?pad(m[4])+':'+m[5]:'',ms:+new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0))};
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?)?/i))){let h=+(m[4]||0);if(/pm/i.test(m[7]||'')&&h<12)h+=12;if(/am/i.test(m[7]||'')&&h===12)h=0;return{date:`${m[3]}-${pad(m[1])}-${pad(m[2])}`,time:m[4]?pad(h)+':'+m[5]:'',ms:+new Date(+m[3],+m[1]-1,+m[2],h,+m[5]||0,+(m[6]||0))}}
  return null;
}
const money=s=>{if(s==null||s==='')return null;s=String(s).trim();const neg=/[(\-−]/.test(s);const n=parseFloat(s.replace(/[^0-9.,]/g,'').replace(/,(?=\d{3}\b)/g,'').replace(',','.'));return isFinite(n)?(neg?-n:n):null};
function importCsv(text){
  const rows=parseCsv(text);if(rows.length<2)return{err:'Файлът е празен или няма редове със сделки.'};
  const h=rows[0].map(x=>x.trim().toLowerCase().replace(/[\s_&]+/g,''));
  const col=(...n)=>{for(const x of n){const i=h.indexOf(x);if(i>=0)return i}return -1};
  const c={sym:col('symbol','contract','instrument','инструмент','product'),qty:col('qty','quantity','paircount','договори'),buyP:col('buyprice'),sellP:col('sellprice'),pnl:col('pnl','profit','netpnl','netprofit','realizedpnl','сума'),r:col('r','резултатr','резултат(r)'),bT:col('boughttimestamp','entrytime','entrydate','opentime'),sT:col('soldtimestamp','exittime','exitdate','closetime'),date:col('date','дата','tradedate'),time:col('time','час'),dir:col('direction','side','посока','markettype'),setup:col('setup','сетъп'),note:col('note','бележка')};
  if(c.pnl<0&&c.r<0)return{err:'Не намерих колона с резултат (pnl, profit или R). Провери дали това е отчет със затворени сделки.'};
  if(c.bT<0&&c.sT<0&&c.date<0)return{err:'Не намерих колона с дата. Провери дали това е отчет със затворени сделки.'};
  const seen=new Set(store.demo?[]:store.trades.map(t=>[t.date,t.time,t.symbol,t.r].join('|')));
  let added=0,skipped=0,bad=0;const fresh=[];
  rows.slice(1).forEach((r,i)=>{
    const a=c.bT>=0?parseStamp(r[c.bT]):null,b=c.sT>=0?parseStamp(r[c.sT]):null;
    let when=(a&&b)?(a.ms<=b.ms?a:b):(a||b);
    if(!when&&c.date>=0){when=parseStamp(r[c.date]+(c.time>=0&&r[c.time]?' '+r[c.time]:''))}
    const pnl=c.pnl>=0?money(r[c.pnl]):null,direct=c.r>=0?num(String(r[c.r]).replace('−','-')):null;
    if(!when||(pnl==null&&direct==null)){bad++;return}
    const rr=direct!=null?direct:round(pnl/store.cfg.rValue);
    let dir='long';if(a&&b)dir=a.ms<=b.ms?'long':'short';else if(c.dir>=0&&/short|sell/i.test(r[c.dir]))dir='short';
    const sym=c.sym>=0?String(r[c.sym]).trim().replace(/[A-Z]\d{1,2}$/,''):'';
    const key=[when.date,when.time,sym,rr].join('|');if(seen.has(key)){skipped++;return}seen.add(key);
    fresh.push({id:'i'+Date.now()+'_'+i,date:when.date,time:when.time,symbol:sym,dir,setup:c.setup>=0?r[c.setup]:'',qty:c.qty>=0?num(r[c.qty]):null,entry:c.buyP>=0&&dir==='long'?num(r[c.buyP]):c.sellP>=0?num(r[c.sellP]):null,stop:null,exit:c.sellP>=0&&dir==='long'?num(r[c.sellP]):c.buyP>=0?num(r[c.buyP]):null,r:rr,pnl:pnl!=null?pnl:round(rr*store.cfg.rValue,2),mistakes:[],checked:[],total:0,emotion:'',note:c.note>=0?r[c.note]:'',source:'import'});
    added++;
  });
  if(added){if(store.demo){store.demo=false;store.trades=[]}store.trades.push(...fresh);save()}
  return{added,skipped,bad};
}

/* Акаунт */
function viewAcc(){
  const A=store.cfg.acc,a=analyse(store.trades);
  let bal=A.size,peak=A.size;a.forEach(t=>{bal+=t.pnl||0;peak=Math.max(peak,bal)});
  const limit=A.type==='trailing'?peak-A.dd:A.size-A.dd,room=bal-limit,profit=bal-A.size,left=Math.max(A.target-profit,0),pr=Math.max(0,Math.min(1,profit/A.target)),rm=Math.max(0,Math.min(1,room/A.dd));
  const s=stats(a),trades=s.exp>0&&left>0?Math.ceil(left/store.cfg.rValue/s.exp):null;
  $('view').innerHTML=`${demoBanner()}<div class="grid2">
  <div class="sheet"><h2>${esc(A.name)}</h2><p class="sub">Смята се от записаните сделки и настройките вдясно.</p>
    <div class="kpis" style="margin-bottom:14px">${kpi('Баланс',fmtM(bal),'старт '+fmtM(A.size))}${kpi('Печалба',`<span class="${cls(profit)}">${fmtM(profit)}</span>`,fmtR(profit/store.cfg.rValue))}${kpi('До просадката',fmtM(room),'граница '+fmtM(limit))}</div>
    <div><b>Път до целта</b><div class="prog"><i style="width:${pr*100}%;background:var(--blue)"></i></div><div class="sub" style="color:var(--muted);font-size:13px">${Math.round(pr*100)}% от ${fmtM(A.target)}. Остават ${fmtM(left)}, или ${round(left/store.cfg.rValue,1)}R.${trades?` При сегашното ти очакване това са около ${trades} сделки.`:''}</div></div>
    <div style="margin-top:14px"><b>Въздух до просадката</b><div class="prog"><i style="width:${rm*100}%;background:${rm<.3?'var(--loss)':rm<.6?'var(--warn)':'var(--win)'}"></i></div><div style="color:var(--muted);font-size:13px">${round(room/store.cfg.rValue,1)}R до границата. ${rm<.3?'Малко въздух: намали риска или спри и прегледай сделките.':''}</div></div>
    <p class="sub" style="margin:14px 0 0">Сметката е от затворените сделки. Prop фирмите често следят и незатворената печалба и правилата им се сменят, така че официалният им дашборд винаги е водещ.</p></div>
  <div class="sheet"><h2>Настройки на акаунта</h2><p class="sub">Сложи стойностите от условията на твоя акаунт.</p><div class="fields">
    <label class="f">Име<input id="a_name" value="${esc(A.name)}"></label><label class="f">Размер ($)<input id="a_size" inputmode="numeric" value="${A.size}"></label>
    <label class="f">Цел за печалба ($)<input id="a_target" inputmode="numeric" value="${A.target}"></label><label class="f">Макс. просадка ($)<input id="a_dd" inputmode="numeric" value="${A.dd}"></label>
    <label class="f">Вид просадка<select id="a_type"><option value="trailing"${A.type==='trailing'?' selected':''}>Трейлинг</option><option value="static"${A.type==='static'?' selected':''}>Статична</option></select></label></div>
    <div class="group"><button class="btn pri" data-act="save-acc">Запази</button></div></div></div>`;
}

function toggle(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v)}
function addSetup(){
  const e=$('newSetup'),name=e.value.trim();
  if(!name){toast('Напиши име на сетъпа.');e.focus();return}

  if(!have)store.cfg.setups.push(name);
  readForm();ui.form.setup=have||name;save();viewNew();
  toast(have?'Този сетъп вече го има и е избран.':'Сетъпът е добавен и избран.');

function saveTrade(){

  const i=store.trades.findIndex(t=>t.id===rec.id);if(i>=0)store.trades[i]=rec;else store.trades.push(rec);

  const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);c.setups=lines($('r_setups').value);c.checklist=lines($('r_check').value);ui.form=null;save();render();toast('Правилата са запазени.');
}
function toCsv(){
  const q=v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['дата','час','инструмент','посока','сетъп','договори','вход','стоп','изход','r','сума','грешки','чек-лист','емоция','бележка'];
  const rows=(store.demo?[]:analyse(store.trades)).map(t=>[t.date,t.time,t.symbol,t.dir,t.setup,t.qty,t.entry,t.stop,t.exit,t.r,t.pnl,(t.mistakes||[]).map(k=>MISTAKES[k]).join(', '),(t.checked||[]).length+'/'+(t.total||0),t.emotion,t.note].map(q).join(';'));
  return '﻿'+[head.join(';'),...rows].join('\n');
}

<script>

function cloudSave(){
  if(!sb||!cloud.user||!cloud.loaded)return;
  clearTimeout(cloud.saveT);
  cloud.saveT=setTimeout(async()=>{
    const {error}=await sb.from('journals').upsert({user_id:cloud.user.id,data:{demo:store.demo,trades:store.demo?[]:store.trades,cfg:store.cfg},updated_at:new Date().toISOString()});
    if(error)toast('Не успях да запиша в облака. Провери интернета.');
  },700);
}
async function loadProfile(){
  const {data}=await sb.from('profiles').select('*').eq('id',cloud.user.id).maybeSingle();
  cloud.profile=data||{plan:'free',name:cloud.user.email};
}
async function onLogin(user){
  if(cloud.user&&cloud.user.id===user.id&&cloud.loaded)return;
  cloud.user=user;cloud.loaded=false;
  await loadProfile();
  const {data}=await sb.from('journals').select('data').eq('user_id',user.id).maybeSingle();
  const d=data&&data.data;
  if(d&&Array.isArray(d.trades)&&(d.trades.length||!d.demo)){
    store={demo:false,trades:d.trades,cfg:Object.assign(clone(DEFAULTS),d.cfg||{})};
    try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
    cloud.loaded=true;
  }else{
    cloud.loaded=true;
    if(!store.demo&&store.trades.length)toast('Сделките от този браузър са качени в профила ти.');
    cloudSave();
  }
  if(ui.tab==='login')ui.tab='dash';
  render();
}
function onLogout(){
  if(cloud.chan){sb.removeChannel(cloud.chan);cloud.chan=null}
  cloud.user=null;cloud.profile=null;cloud.loaded=false;cloud.lessons={};cloud.msgs=[];
  store={demo:true,trades:demoTrades(),cfg:clone(DEFAULTS)};
  try{localStorage.removeItem(KEY)}catch(e){}
  ui.tab='dash';render();
}
async function callFn(name){
  const {data,error}=await sb.functions.invoke(name,{body:{}});
  if(error||!data||!data.url){toast((data&&data.error)||'Нещо се обърка. Опитай пак след малко.');return}

}

const lmsg=(m,bad)=>{const e=$('l_msg');if(e){e.textContent=m;e.style.color=bad?'var(--loss)':'var(--win)'}};
async function doAuth(kind){
  const email=$('l_email').value.trim(),password=$('l_pass').value;
  if(!email){lmsg('Напиши имейл.',1);return}
  if(kind==='reset'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});lmsg(error?'Не успях да изпратя имейл. Опитай след малко.':'Изпратих линк за нова парола. Провери и Спам.',!!error);return}
  if(password.length<8){lmsg('Паролата трябва да е поне 8 символа.',1);return}
  if(kind==='signup'){
    const name=$('l_name').value.trim()||email.split('@')[0];
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.origin+location.pathname}});
    if(error){lmsg(error.message.includes('registered')?'Този имейл вече има профил. Натисни „Вход“.':'Регистрацията не мина: '+error.message,1);return}
    if(!data.session)lmsg('Провери имейла си (и Спам) и потвърди регистрацията.');
  }else{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)lmsg(error.message.includes('confirm')?'Потвърди имейла си от писмото, което получи.':'Грешен имейл или парола.',1);
  }
}

async function addLesson(){

  if(!yt){toast('Не разпознах YouTube линка.');return}
  const {error}=await sb.from('lessons').insert({title,category:$('n_cat').value,level:$('n_level').value,sort:num($('n_sort').value)||100,description:$('n_desc').value.trim(),youtube_id:yt,free:$('n_free').getAttribute('aria-pressed')==='true'});

/* Чат */
async function viewChat(){
  if(!sb){$('view').innerHTML=needSb();return}
  if(!cloud.user){$('view').innerHTML='<div class="sheet empty">Влез, за да видиш чата. <button class="btn small pri" data-act="go-login">Вход</button></div>';return}
  if(!isPro()){$('view').innerHTML='<div class="sheet"><h2>Общностният чат е за абонати</h2><p class="sub">Тук трейдъри от канала споделят сделки, въпроси и прогреса си.</p><button class="btn pri" data-tab="plan">Виж плана</button></div>';return}
  $('view').innerHTML=`<div class="sheet"><h2>Общност</h2><p class="sub">Бъди полезен и уважителен. Без сигнали и без обещания за печалба.</p><div class="chatlog" id="chatlog"><div class="empty">Зареждам…</div></div>
    <div class="row" style="margin-top:10px;align-items:flex-end"><textarea id="c_body" maxlength="1000" placeholder="Напиши съобщение (Enter изпраща, Shift+Enter нов ред)" style="flex:1 1 240px;min-height:46px;width:auto"></textarea><button class="btn pri" data-act="send">Изпрати</button></div></div>`;
  const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(100);
  cloud.msgs=(data||[]).reverse();drawChat();
  if(!cloud.chan){
    cloud.chan=sb.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(!cloud.msgs.find(m=>m.id===p.new.id)){cloud.msgs.push(p.new);drawChat()}})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{cloud.msgs=cloud.msgs.filter(m=>m.id!==p.old.id);drawChat()}).subscribe();
  }
}
function drawChat(){
  const box=$('chatlog');if(!box)return;
  const admin=cloud.profile&&cloud.profile.is_admin;
  box.innerHTML=cloud.msgs.length?cloud.msgs.map(m=>{const mine=m.user_id===cloud.user.id;const d=new Date(m.created_at);
    return `<div class="msg ${mine?'me':''}"><b>${esc(m.name)}</b><time>${d.toLocaleDateString('bg-BG',{day:'2-digit',month:'2-digit'})} ${pad(d.getHours())}:${pad(d.getMinutes())}</time>${mine||admin?` <button class="btn small" style="padding:0 5px;font-size:11px" data-act="del-msg" data-id="${m.id}" aria-label="Изтрий">✕</button>`:''}<p>${esc(m.body)}</p></div>`}).join(''):'<div class="empty">Няма съобщения. Бъди пръв!</div>';
  box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
  const e=$('c_body'),body=e.value.trim();if(!body)return;
  e.value='';
  const {data,error}=await sb.from('messages').insert({body,name:(cloud.profile&&cloud.profile.name)||'Трейдър'}).select().single();
  if(error){e.value=body;toast('Съобщението не мина.');return}
  if(!cloud.msgs.find(m=>m.id===data.id)){cloud.msgs.push(data);drawChat()}
}

/* Разбор на сделката (по правилата и статистиката, без външен AI) */
function showCoach(id){
  if(!isPro()){ui.tab='plan';render();toast('Разборът на сделките е в плана „Пълен достъп“.');return}
  const all=analyse(store.trades),t=all.find(x=>x.id===id);if(!t)return;
  const c=store.cfg,P=[];
  const grp=(fn,v)=>{const x=all.filter(o=>fn(o)===v);return{n:x.length,sum:x.reduce((s,o)=>s+o.r,0)}};
  const verdict=t.pending?'Импортирана сделка: отвори „Редакция“, отбележи чек-листа и грешките, и тогава разборът става пълен.'
    :t.clean&&t.r<0?'Добра загуба. Спазил си плана и загубата е цената на бизнеса. Тук няма какво да поправяш.'
    :t.clean&&t.r>=0?'Така изглежда работата: сделка по плана. Повтаряй точно това.'
    :t.r>0?'Внимание: печалба с нарушение. Това е най-опасната сделка, защото учи мозъка, че нарушението се плаща.'
    :'Загуба с нарушение. Тази загуба не е от пазара, а от решението.';
  P.push(`<p class="insight" style="font-size:22px">${verdict}</p>`);
  P.push(`<p><b>Резултат:</b> <span class="${cls(t.r)}">${fmtR(t.r)}</span>${t.pnl!=null?' ('+fmtM(t.pnl)+')':''}, ${bgDate(t.date)} ${esc(t.time||'')}, ${esc(t.setup||'без сетъп')}.</p>`);
  const why={day:`Денят (${DAYS[parseDay(t.date).getDay()]}) е в списъка с дни, в които не търгуваш.`,window:`Входът е извън прозореца ${c.start}–${c.end}.`,over:`Това е сделка над лимита от ${c.maxTrades} на ден.`,afterstop:`Влязъл си след като дневният стоп от −${c.dailyLoss}R вече беше ударен.`,plan:`Чек-листът е отметнат ${(t.checked||[]).length} от ${t.total}.`};
  t.flags.forEach(k=>{const g=grp(o=>o.flags.includes(k)?k:'',k);P.push(`<p class="neg"><b>✕ ${FLAGS[k]}.</b> <span style="color:var(--ink)">${why[k]} Всички сделки с това нарушение: ${g.n}, сбор ${fmtR(g.sum)}.</span></p>`)});
  (t.mistakes||[]).forEach(k=>{const g=grp(o=>(o.mistakes||[]).includes(k)?k:'',k);P.push(`<p class="neg"><b>✕ ${MISTAKES[k]}.</b> <span style="color:var(--ink)">Досега си го правил ${g.n} пъти, общо ${fmtR(g.sum)}.</span></p>`)});
  if(t.setup){const g=grp(o=>o.setup,t.setup);P.push(`<p><b>Сетъпът:</b> ${g.n} сделки, средно ${fmtR(g.sum/g.n)} на сделка${g.n<20?' (под 20 сделки, гледай го като насока)':''}.</p>`)}
  if(t.time){const h=t.time.slice(0,2),g=grp(o=>(o.time||'').slice(0,2),h);P.push(`<p><b>Часът ${h}:00:</b> ${g.n} сделки, сбор ${fmtR(g.sum)}.</p>`)}
  if(t.emotion){const g=grp(o=>o.emotion,t.emotion);P.push(`<p><b>Емоция „${esc(t.emotion)}“:</b> ${g.n} сделки, средно ${fmtR(g.sum/g.n)}.${t.emotion!=='Спокоен'?' Когато не си спокоен, правилото е по-важно от сетъпа.':''}</p>`)}
  const cl=all.filter(o=>o.clean),dr=all.filter(o=>!o.clean&&!o.pending);
  if(cl.length&&dr.length)P.push(`<p><b>Голямата картина:</b> чистите ти сделки носят средно ${fmtR(cl.reduce((s,o)=>s+o.r,0)/cl.length)}, а тези с нарушение ${fmtR(dr.reduce((s,o)=>s+o.r,0)/dr.length)}.</p>`);
  $('modal').hidden=false;
  $('modal').innerHTML=`<div class="sheet coach" style="max-height:88vh;overflow-y:auto"><h2>Разбор на сделката</h2>${P.join('')}<p class="sub">Разборът е по твоите правила и записи, не е финансов съвет.</p><div class="row"><button class="btn pri" data-act="close-modal">Затвори</button></div></div>`;
}

async function cloudAct(act,b){
  switch(act){
    case 'go-login':ui.tab='login';render();break;
    case 'login':doAuth('login');break;
    case 'signup':doAuth('signup');break;
    case 'reset':doAuth('reset');break;
    case 'logout':await sb.auth.signOut();break;
    case 'checkout':b.disabled=true;b.textContent='Отварям плащането…';await callFn('create-checkout');b.disabled=false;b.textContent='Абонирай се за 5 €/месец';break;
    case 'portal':b.disabled=true;await callFn('customer-portal');b.disabled=false;break;
    case 'save-name':{const {error}=await sb.rpc('set_my_name',{new_name:$('p_name').value});if(error)toast('Не се запази.');else{await loadProfile();render();toast('Името е запазено.')}break}
    case 'cat':cloud.cat=b.dataset.cat;viewLearn();break;
    case 'play':{const v=cloud.lessons[b.dataset.id];$('v'+b.dataset.id).innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Урок"></iframe>`;break}
    case 'toggle-free':b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');break;
    case 'add-lesson':addLesson();break;
    case 'del-lesson':if(b.dataset.armed){const {error}=await sb.from('lessons').delete().eq('id',b.dataset.id);toast(error?'Не се изтри.':'Урокът е изтрит.');viewLearn()}else{b.dataset.armed=1;b.textContent='Сигурен ли си?'}break;
    case 'send':sendMsg();break;
    case 'del-msg':await sb.from('messages').delete().eq('id',b.dataset.id);cloud.msgs=cloud.msgs.filter(m=>String(m.id)!==b.dataset.id);drawChat();break;
  }
}

  if(q.get('paid')==='1'){
    toast('Благодаря! Активирам абонамента…');
    for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,2000));if(cloud.user){await loadProfile();if(isPro()){render();toast('Абонаментът е активен. Добре дошъл!');break}}}
  }
})();
